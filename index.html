<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Académico | Conalep Playa del Carmen</title>
  
  <link rel="stylesheet" href="css/base.css">
  <!-- Carga de Chart.js para la gráfica de avance -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* Estilos locales para el Dashboard */
    .hidden { display: none !important; }
    .grid-unidades { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.2rem; margin-top: 1rem; }
    .card-modulo { background: #fff; padding: 1.2rem; border-radius: 6px; border: 1px solid var(--border-card); border-left: 4px solid var(--conalep-accent); display: flex; flex-direction: column; }
    .card-modulo.locked { border-left-color: #94a3b8; background: #f1f5f9; opacity: 0.85; }
    .badge-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 12px; font-weight: bold; align-self: flex-start; margin: 8px 0; }
    .status-ok { background: #dcfce7; color: #166534; }
    .status-act { background: #fef08a; color: #854d0e; }
    .status-lock { background: #e2e8f0; color: #475569; }
    .status-pend { background: #fee2e2; color: #991b1b; }
    .table-evidencias { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .table-evidencias th, .table-evidencias td { padding: 10px; border-bottom: 1px solid var(--border-card); text-align: left; }
    .table-evidencias th { background: #f8fafc; color: var(--conalep-dark); }
    
    /* Responsive para la leyenda de cabecera */
    @media (min-width: 768px) { .header-credits { display: block !important; } }
  </style>
</head>
<body>

  <!-- CABECERA INSTITUCIONAL -->
  <header class="main-header">
    <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      
      <div style="display: flex; align-items: center; gap: 15px;">
        <img src="image_4bef00.png" alt="Logo CONALEP" style="height: 50px; width: auto;" onerror="this.style.display='none'">
        <div>
          <div class="brand-title" style="font-weight: 700; font-size: 1.15rem;">CONALEP PLAYA DEL CARMEN</div>
          <div class="brand-sub" style="font-size: 0.8rem; color: #a7f3d0;">Temas Selectos de Matemáticas II</div>
        </div>
      </div>

      <!-- Leyenda de Autoría Oculta en Móviles -->
      <div class="header-credits" style="text-align: center; display: none;">
          <span style="color: #a7f3d0; font-size: 0.8rem; font-weight: bold;">● Sistema Activo SICAL</span><br>
          <span style="font-size: 0.75rem; color: #cbd5e1;">Desarrollado por: Prof. Juan Luis | © 2026 Todos los derechos reservados.</span>
      </div>

      <div id="user-menu" class="hidden" style="background: rgba(0,0,0,0.15); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; display: flex; gap: 10px; align-items: center;">
        <span id="welcome-name">👤 Bienvenido</span>
        <span style="color: #cbd5e1;">|</span>
        <button onclick="cerrarSesion()" style="background: none; border: none; color: #fca5a5; font-weight: bold; cursor: pointer;">Salir</button>
      </div>

    </div>
  </header>

  <main class="container">
    
    <!-- ==========================================
         VISTA A: LOGIN
         ========================================== -->
    <section id="vista-login" class="card-box" style="max-width: 400px; margin: 4rem auto; text-align: center;">
      <h2 style="color: var(--conalep-dark); margin-bottom: 1.5rem;">🎓 Acceso al Portal</h2>
      <input type="text" id="input-matricula
